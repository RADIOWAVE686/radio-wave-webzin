
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEWS | RADIO WAVE</title>
<style>
:root {
  --navy: #0b1020;
  --panel: #111a30;
  --purple: #9d7bff;
  --text: #f5f6fa;
  --muted: #aab3c8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--navy);
  color: var(--text);
  font-family: Pretendard, "Noto Sans KR", sans-serif;
}
header {
  padding: 28px 6vw;
  border-bottom: 1px solid #29334b;
}
.brand {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
}
.brand small {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
}
nav { margin-top: 22px; }
nav a, .back {
  color: #d8c9ff;
  text-decoration: none;
  font-size: 14px;
}
main {
  width: min(100% - 36px, 900px);
  margin: 42px auto 80px;
}
.eyebrow {
  color: var(--purple);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
}
h1 { font-size: clamp(34px, 6vw, 52px); margin: 10px 0; }
.intro { color: var(--muted); line-height: 1.7; }
#status { color: var(--muted); margin: 28px 0 14px; font-size: 14px; }
.card {
  display: block;
  padding: 24px 0;
  border-top: 1px solid #29334b;
  color: inherit;
  text-decoration: none;
}
.card:hover h2 { color: #c7b5ff; }
.category {
  color: #c7b5ff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
}
h2 { margin: 10px 0; font-size: 22px; line-height: 1.45; }
.summary { color: #c0c7d7; line-height: 1.7; margin: 0 0 12px; }
.date { color: #8792aa; font-size: 12px; }
footer {
  padding: 28px 6vw;
  border-top: 1px solid #29334b;
  color: var(--muted);
  font-size: 12px;
}
</style>
</head>
<body>
<header>
  <div class="brand">RADIO WAVE
    <small>INDEPENDENT RADIO CULTURE WEBZINE</small>
  </div>
  <nav><a href="index.html">← 메인으로 돌아가기</a></nav>
</header>

<main>
  <div class="eyebrow">RADIO WAVE / LATEST</div>
  <h1>NEWS</h1>
  <p class="intro">라디오를 실제로 듣는 사람이 기록합니다.<br>방송의 소식과 역사, 청취자의 이야기를 전합니다.</p>
  <div id="status">기사 목록을 불러오는 중...</div>
  <section id="articles" aria-live="polite"></section>
</main>

<footer>RADIO WAVE · 99.0 MHz · HLRW-SFM</footer>

<script>
async function loadArticles() {
  const status = document.getElementById("status");
  const list = document.getElementById("articles");

  try {
    const response = await fetch("articles/articles.json?t=" + Date.now());
    if (!response.ok) throw new Error("목록 파일을 불러오지 못했습니다.");

    const data = await response.json();
    const articles = Array.isArray(data)
      ? data
      : (Array.isArray(data.articles) ? data.articles : []);

    articles.sort((a, b) =>
      String(b.date || "").localeCompare(String(a.date || ""))
    );

    if (!articles.length) {
      status.textContent = "아직 등록된 기사가 없습니다.";
      return;
    }

    status.textContent = "총 " + articles.length + "개의 기사";
    list.replaceChildren();

    articles.forEach(article => {
      if (!article || !article.id || !article.title) return;

      const link = document.createElement("a");
      link.className = "card";
      link.href = "article.html?id=" + encodeURIComponent(article.id);

      const category = document.createElement("div");
      category.className = "category";
      category.textContent = article.category || "NEWS";

      const title = document.createElement("h2");
      title.textContent = article.title;

      const summary = document.createElement("p");
      summary.className = "summary";
      summary.textContent = article.summary || "";

      const date = document.createElement("div");
      date.className = "date";
      date.textContent = article.date || "";

      link.append(category, title, summary, date);
      list.appendChild(link);
    });

    if (!list.children.length) {
      status.textContent = "목록에 표시할 수 있는 기사가 없습니다. JSON 구조를 확인해 주세요.";
    }
  } catch (error) {
    status.textContent = "기사 목록을 불러오지 못했습니다. articles.json의 형식을 확인해 주세요.";
    console.error(error);
  }
}
loadArticles();
</script>
</body>
</html>
